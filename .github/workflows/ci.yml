name: CI

# Build and test both halves on every change. The release workflow only runs on
# tags, so until this existed nothing checked a commit before it shipped — and
# the one thing that most needs checking, that the Mac and the phone still
# derive the same session key, is a pair of tests that can only fail together.
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

  mac:
    # Matches the release workflow: swift-protobuf 1.38's generated code needs
    # Swift 6.1+, which ships with Xcode 16.4 on macos-15.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: mac
        run: swift test
