[package]
name = "bridg-desktop"
version = "0.4.1"
edition = "2021"
description = "Bridg hub for Windows (and Linux): the computer side of the phone link"
license = "MIT"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs"] }
prost = "0.13"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"
mdns-sd = "0.21"
arboard = { version = "3", default-features = false }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gethostname = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
prost-build = "0.13"
# protoc ships inside the crate, so no build machine needs it installed.
protoc-bin-vendored = "3"

[profile.release]
strip = true
lto = true
